<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel SIGSSe — Configurações do Mascote</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-title">
        <span class="logo-icon">💧</span>
        <div>
          <h1>Painel SIGSSe</h1>
          <p class="subtitle">Mascotes & Campanhas de Saúde</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="mascotEnabled" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <main class="content">
      <div class="card sync-card">
        <div class="sync-info">
          <span class="status-dot"></span>
          <span class="sync-text" id="syncStatus">Conteúdo Remoto: Sincronizado (v2.0.0)</span>
        </div>
      </div>

      <div class="section">
        <h2>Visual e Skin</h2>
        <div class="form-group">
          <label for="mascotSkin">Escolher Mascote / Skin</label>
          <select id="mascotSkin">
            <option value="gotinha">💧 Zé Gotinha Clássico</option>
            <option value="gatinho_laranja">🐱 Gatinho Laranja</option>
            <option value="robozinho_azul">🤖 Robozinho Azul</option>
            <option value="mixed">🔀 Misturado (Rotativo)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mascotCount">Quantidade de Mascotes na Tela</label>
          <div class="count-selector">
            <button type="button" class="btn-count" data-count="1">1</button>
            <button type="button" class="btn-count" data-count="2">2</button>
            <button type="button" class="btn-count" data-count="3">3</button>
            <button type="button" class="btn-count" data-count="4">4</button>
          </div>
        </div>
      </div>

      <div class="section">
        <h2>Ajustes Físicos</h2>
        <div class="form-group">
          <div class="label-val">
            <label for="size">Tamanho</label>
            <span id="sizeVal">64px</span>
          </div>
          <input type="range" id="size" min="40" max="128" step="4" value="64">
        </div>

        <div class="form-group">
          <div class="label-val">
            <label for="speedMultiplier">Velocidade</label>
            <span id="speedVal">1.0x</span>
          </div>
          <input type="range" id="speedMultiplier" min="0.5" max="2.5" step="0.1" value="1.0">
        </div>

        <div class="form-group">
          <div class="label-val">
            <label for="opacity">Opacidade</label>
            <span id="opacityVal">90%</span>
          </div>
          <input type="range" id="opacity" min="0.3" max="1.0" step="0.05" value="0.9">
        </div>
      </div>

      <div class="section">
        <h2>Comportamento e Interação</h2>
        <div class="toggle-row">
          <span>Reagir a Chamadas de Pacientes</span>
          <label class="switch sm">
            <input type="checkbox" id="callAwareness" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span>Exibir Campanhas de Saúde</span>
          <label class="switch sm">
            <input type="checkbox" id="campaignsEnabled" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>Versão 2.0.0 — UBS Betim / SIGSS</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
